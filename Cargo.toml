[workspace]
members = ["crates/*", "bin/*"]
resolver = "2"

[workspace.package]
edition = "2024"


[workspace.dependencies]
symphonia = {version = "0.5", features = ["all-codecs"]}
thiserror = "2.0.16"
tracing = "0.1.41"


[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
