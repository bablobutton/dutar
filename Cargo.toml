[package]
name = "dutar"
version = "0.1.0"
description = "TUI Music Player"
authors = ["Ata Altyyev <altyew44@gmail.com>", "Konstantin Dal <email@email.com>"]
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
color-eyre = { version = "0.6.3", default-features = false }
symphonia = "0.5"
thiserror = "2.0.17"
tracing = "0.1.41"
rodio = "0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0

[dev-dependencies]
rusty-hook = "0.11.2"
